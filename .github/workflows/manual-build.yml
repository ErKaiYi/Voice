name: Manual Build APK
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '分支名称'
        required: true
        default: 'main'

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Build setup
        uses: ./.github/actions/build_setup

      - name: Compile FreeDebug APK
        run: ./gradlew :app:assembleFreeDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: free-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk

